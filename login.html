<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login - Puasaku by Nursyam</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="login-page">
    <div class="container">
        <div class="login-card">
            <div class="logo-container">
                <div class="crescent-moon small"></div>
                <h1>Puasaku</h1>
                <p class="subtitle">by Nursyam</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="name">Nama Panggilan</label>
                    <input type="text" id="name" name="name" placeholder="Contoh: Ahmad" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="target">Target Sedekah/Khatam</label>
                    <input type="text" id="target" name="target" placeholder="Contoh: Rp 500.000 / 30 Juz" required autocomplete="off">
                </div>
                
                <button type="submit" class="btn-primary">Mulai Perjalanan</button>
            </form>
            
            <p class="login-note">✦ Selamat Menunaikan Ibadah Puasa ✦</p>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
