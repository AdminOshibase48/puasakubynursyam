<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Puasaku</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E7D32">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-mosque" style="font-size: 3rem; color: #2E7D32;"></i>
                <h1>Puasaku</h1>
                <p>by Nursyam</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nama/Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan nama Anda" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>
            
            <div class="login-footer">
                <p>Selamat datang di aplikasi tracker Ramadan</p>
                <i class="fas fa-moon" style="color: #C5A059;"></i>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
