<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Puasaku by Nursyam</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B4F3C">
</head>
<body class="transition-page">
    <div class="container">
        <div class="loading-content">
            <div class="crescent-moon"></div>
            <h2 class="loading-text">Menyiapkan Berkah Ramadan...</h2>
            <div class="loading-progress">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        // Gatekeeper logic
        setTimeout(() => {
            const userProfile = JSON.parse(localStorage.getItem('puasaku_user'));
            if (userProfile && userProfile.name) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        }, 1500);
    </script>
</body>
</html>
